name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hub-mcp/go.mod
          cache-dependency-path: hub-mcp/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
